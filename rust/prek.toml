# Hooks that run before each commit, managed by prek.
#
# `repo = "builtin"` means prek runs its own implementation, so there is
# nothing to fetch. `repo = "local"` hooks run the tools that the Nix flake
# puts on the PATH.

# Files that are not ours to rewrite. Cargo and Nix generate these, and a hook
# that reformats one puts it out of step with the tool that wrote it.
exclude = '''(?x)^(
    flake\.lock
  | Cargo\.lock
)$'''

[[repos]]
repo = "builtin"
hooks = [
  # Whitespace and line endings.
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
  { id = "fix-byte-order-marker" },

  # Validity of data formats
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "check-toml" },

  # Things we don't want to commit by accident
  { id = "detect-private-key" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=2048"] },

  # Things that might break on not-macOS
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-symlinks" },
  { id = "destroyed-symlinks" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
]

# Rust. rustfmt rewrites the staged files, and the commit fails if it changed
# any. Clippy checks the whole crate, so it takes no file names.
[[repos]]
repo = "local"
hooks = [
  { id = "rustfmt", name = "rustfmt", language = "system", entry = "rustfmt --edition 2024", types = ["rust"] },
  { id = "clippy", name = "clippy", language = "system", entry = "cargo clippy --all-targets --locked -- -D warnings", files = '(^|/)Cargo\.(toml|lock)$|\.rs$', pass_filenames = false },
]

# Bash scripts.
[[repos]]
repo = "local"
hooks = [
  { id = "shellcheck", name = "shellcheck", language = "system", entry = "shellcheck", types = ["shell"] },
]
